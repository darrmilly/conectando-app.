            margin: 0;

        }
        .sky-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: linear-gradient(180deg, #4A90E2 0%, #7ED321 100%);
            background: linear-gradient(to bottom, #5cb8ff, #a0ff8c);

        }
        .cloud {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.6;
            filter: blur(20px);
        }
        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 10px 2px white;
            animation: twinkle 2s infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        .profile-glow {
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.6);
        }
        .tag-shadow {
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .wave-bar {
            transition: height 0.1s ease;
        }
